<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ma todo list</title>
</head>
<body>
    <div class="container">
        <h1>Todo List</h1>
        <div class="formulaire">
            <input class="inputtext" type="text" placeholder="Entrer votre tâche ">
            <button class="add">ADD</button>
            <button class="clear">CLEAR</button>
        </div>
        <div class="ftasks"></div>
        <details>
            <summary>Tâches terminées</summary>
        </details>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
